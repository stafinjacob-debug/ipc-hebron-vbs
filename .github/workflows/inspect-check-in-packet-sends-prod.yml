# One-off read-only: inspect production Graph Sent Items for check-in packet bulk sends.
# Does not send email.
name: Inspect Check-In Packet Sends (Production)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm ci

      - name: Azure Login (production)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PROD_AZURE_CREDENTIALS }}

      - name: Load Graph settings from prod App Service
        id: graph
        env:
          WEBAPP_NAME: ${{ secrets.PROD_AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          RG=rg-ipc-hebron-vbs-prod
          NAME="$WEBAPP_NAME"
          echo "webapp=$NAME rg=$RG"
          # Export settings into GITHUB_ENV without printing secret values
          for key in MICROSOFT_GRAPH_TENANT_ID MICROSOFT_GRAPH_CLIENT_ID MICROSOFT_GRAPH_CLIENT_SECRET MICROSOFT_GRAPH_MAILBOX EMAIL_FROM_DISPLAY_NAME; do
            val=$(az webapp config appsettings list -g "$RG" -n "$NAME" --query "[?name=='$key'].value | [0]" -o tsv)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "missing_setting=$key" >> "$GITHUB_OUTPUT"
              echo "Missing app setting: $key"
            else
              echo "$key=$val" >> "$GITHUB_ENV"
              if [ "$key" = "MICROSOFT_GRAPH_MAILBOX" ] || [ "$key" = "EMAIL_FROM_DISPLAY_NAME" ]; then
                echo "setting $key=$val"
              else
                echo "setting $key=(set, ${#val} chars)"
              fi
            fi
          done

      - name: Inspect Graph Sent Items (read-only)
        run: npx tsx scripts/inspect-check-in-packet-sends.ts

      - name: Inspect packet eligibility vs active registrations (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          npx tsx <<'EOF'
          import { PrismaPg } from "@prisma/adapter-pg";
          import { Pool } from "pg";
          import { PrismaClient, type RegistrationStatus } from "./src/generated/prisma";

          const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const prisma = new PrismaClient({ adapter: new PrismaPg(pool) });

          async function main() {
            const seasons = await prisma.vbsSeason.findMany({
              select: { id: true, name: true, year: true, isActive: true },
              orderBy: { year: "desc" },
            });
            console.log("seasons", seasons.map((s) => `${s.year} ${s.name} active=${s.isActive}`));

            const united =
              seasons.find((s) => /united/i.test(s.name)) ??
              seasons.find((s) => s.isActive) ??
              seasons[0];
            if (!united) throw new Error("no season");
            console.log("usingSeason", united.name, united.id);

            const statuses = ["PENDING", "CONFIRMED", "WAITLIST", "CANCELLED", "CHECKED_OUT"] as RegistrationStatus[];
            const byStatus: Record<string, number> = {};
            for (const st of statuses) {
              byStatus[st] = await prisma.registration.count({
                where: { seasonId: united.id, status: st },
              });
            }
            console.log("registrationsByStatus", byStatus);

            const activeStatuses = ["PENDING", "CONFIRMED", "WAITLIST"] as RegistrationStatus[];
            const activeRows = await prisma.registration.findMany({
              where: { seasonId: united.id, status: { in: activeStatuses } },
              select: {
                status: true,
                registrationNumber: true,
                checkInToken: true,
                child: {
                  select: {
                    guardian: { select: { email: true, firstName: true, lastName: true } },
                  },
                },
              },
            });

            function stats(rows: typeof activeRows) {
              const families = new Set<string>();
              const eligFamilies = new Set<string>();
              let skipEmail = 0;
              let skipId = 0;
              let eligKids = 0;
              for (const row of rows) {
                const email = row.child.guardian.email?.trim() ?? "";
                const key =
                  email && EMAIL_RE.test(email)
                    ? email.toLowerCase()
                    : `name:${row.child.guardian.firstName}|${row.child.guardian.lastName}`.toLowerCase();
                families.add(key);
                if (!email || !EMAIL_RE.test(email)) {
                  skipEmail += 1;
                  continue;
                }
                if (!row.registrationNumber?.trim() || !row.checkInToken?.trim()) {
                  skipId += 1;
                  continue;
                }
                eligKids += 1;
                eligFamilies.add(email.toLowerCase());
              }
              return {
                registrations: rows.length,
                families: families.size,
                packetEligibleFamilies: eligFamilies.size,
                packetEligibleChildren: eligKids,
                skippedRegsNoEmail: skipEmail,
                skippedRegsNoRegNumOrToken: skipId,
              };
            }

            console.log("audienceAllActive", stats(activeRows));
            console.log("audienceConfirmedDefault", stats(activeRows.filter((r) => r.status === "CONFIRMED")));
            console.log("audiencePending", stats(activeRows.filter((r) => r.status === "PENDING")));
            console.log("audienceWaitlist", stats(activeRows.filter((r) => r.status === "WAITLIST")));

            // Family-level: who would / would not get a packet under all_active
            type Fam = {
              email: string;
              name: string;
              elig: number;
              missingId: number;
              noEmail: number;
              statuses: Set<string>;
            };
            const famMap = new Map<string, Fam>();
            for (const row of activeRows) {
              const g = row.child.guardian;
              const email = g.email?.trim() ?? "";
              const key =
                email && EMAIL_RE.test(email)
                  ? email.toLowerCase()
                  : `name:${g.firstName}|${g.lastName}`.toLowerCase();
              let f = famMap.get(key);
              if (!f) {
                f = {
                  email: email && EMAIL_RE.test(email) ? email.toLowerCase() : "(no valid email)",
                  name: `${g.firstName} ${g.lastName}`.trim(),
                  elig: 0,
                  missingId: 0,
                  noEmail: 0,
                  statuses: new Set(),
                };
                famMap.set(key, f);
              }
              f.statuses.add(row.status);
              if (!email || !EMAIL_RE.test(email)) {
                f.noEmail += 1;
                continue;
              }
              if (!row.registrationNumber?.trim() || !row.checkInToken?.trim()) {
                f.missingId += 1;
                continue;
              }
              f.elig += 1;
            }
            const fams = [...famMap.values()];
            const would = fams.filter((f) => f.elig > 0);
            const wouldNot = fams.filter((f) => f.elig === 0);
            console.log(
              "activeFamilyPacketSplit",
              JSON.stringify(
                {
                  totalActiveFamilies: fams.length,
                  wouldReceivePacket_allActiveAudience: would.length,
                  wouldNotReceivePacket: wouldNot.length,
                  reasonNoValidEmail: wouldNot.filter((f) => f.email === "(no valid email)").length,
                  reasonMissingRegNumOrQrToken: wouldNot.filter((f) => f.email !== "(no valid email)").length,
                },
                null,
                2,
              ),
            );

            const statusMix: Record<string, number> = {};
            for (const f of wouldNot) {
              const k = [...f.statuses].sort().join("+");
              statusMix[k] = (statusMix[k] || 0) + 1;
            }
            console.log("familiesNotReceiving_statusMix", statusMix);

            const known = [
              "mathew.joshua@gmail.com","jobyt3@gmail.com","jomon3@outlook.com","litty27@hotmail.com",
              "wtmathew@gmail.com","bencyab@hotmail.com","andrewbabu06@gmail.com","jomy.george26@gmail.com",
              "wvarkey@gmail.com","alanjohngeorge75@gmail.com","biju360@yahoo.com","cbcofjc@sbcglobal.net",
              "jbkuriyan@gmail.com","gbewin@yahoo.com",
            ];
            const elig = new Set(would.map((f) => f.email));
            console.log("known14InEligible", known.filter((e) => elig.has(e)).length, "of", known.length);
            console.log("eligibleBeyondKnown14Count", [...elig].filter((e) => !known.includes(e)).length);

            // Confirmed-only eligible list size vs known 14
            const confirmedElig = new Set(
              fams
                .filter((f) => f.elig > 0 && [...f.statuses].includes("CONFIRMED"))
                .map((f) => f.email),
            );
            // More accurate: recompute confirmed-only from rows
            const confirmedStats = stats(activeRows.filter((r) => r.status === "CONFIRMED"));
            console.log("confirmedEligibleMatchesKnown14", confirmedStats.packetEligibleFamilies === 14);

            console.log(
              "sampleWouldNot_missingIdentity",
              wouldNot
                .filter((f) => f.email !== "(no valid email)")
                .slice(0, 15)
                .map((f) => ({
                  name: f.name,
                  email: f.email,
                  kidsMissingToken: f.missingId,
                  statuses: [...f.statuses],
                })),
            );

            // Payment audiences (same filters as compose/packet UI)
            const { mergeRegistrationPaymentStatusFilter } = await import(
              "./src/lib/registration-list-payment.ts"
            );
            for (const kind of ["paid", "due", "checkout_pending", "not_required"] as const) {
              const where = {
                seasonId: united.id,
                status: { in: ["PENDING", "CONFIRMED", "WAITLIST"] as RegistrationStatus[] },
              };
              mergeRegistrationPaymentStatusFilter(where, kind);
              const payRows = await prisma.registration.findMany({
                where,
                select: {
                  registrationNumber: true,
                  checkInToken: true,
                  child: { select: { guardian: { select: { email: true } } } },
                },
              });
              const elig = new Set<string>();
              for (const r of payRows) {
                const email = r.child.guardian.email?.trim().toLowerCase() ?? "";
                if (!email || !EMAIL_RE.test(email)) continue;
                if (!r.registrationNumber?.trim() || !r.checkInToken?.trim()) continue;
                elig.add(email);
              }
              const known = [
                "mathew.joshua@gmail.com","jobyt3@gmail.com","jomon3@outlook.com","litty27@hotmail.com",
                "wtmathew@gmail.com","bencyab@hotmail.com","andrewbabu06@gmail.com","jomy.george26@gmail.com",
                "wvarkey@gmail.com","alanjohngeorge75@gmail.com","biju360@yahoo.com","cbcofjc@sbcglobal.net",
                "jbkuriyan@gmail.com","gbewin@yahoo.com",
              ];
              console.log(
                "paymentAudience",
                JSON.stringify({
                  kind,
                  regs: payRows.length,
                  eligFamilies: elig.size,
                  known14Overlap: known.filter((e) => elig.has(e)).length,
                  exactMatchKnown14: elig.size === 14 && known.every((e) => elig.has(e)),
                }),
              );
            }

            // Profile the 14 who actually received mail
            const knownEmails = [
              "mathew.joshua@gmail.com","jobyt3@gmail.com","jomon3@outlook.com","litty27@hotmail.com",
              "wtmathew@gmail.com","bencyab@hotmail.com","andrewbabu06@gmail.com","jomy.george26@gmail.com",
              "wvarkey@gmail.com","alanjohngeorge75@gmail.com","biju360@yahoo.com","cbcofjc@sbcglobal.net",
              "jbkuriyan@gmail.com","gbewin@yahoo.com",
            ];
            const knownRows = await prisma.registration.findMany({
              where: {
                seasonId: united.id,
                child: { guardian: { email: { in: knownEmails, mode: "insensitive" } } },
              },
              select: {
                status: true,
                expectsPayment: true,
                paymentReceivedAt: true,
                classroomId: true,
                classroom: { select: { name: true } },
                formSubmission: { select: { stripePaymentStatus: true, payLaterChosen: true } },
                child: { select: { guardian: { select: { email: true } } } },
              },
            });
            const byStatus: Record<string, number> = {};
            const byClass: Record<string, number> = {};
            const byPay: Record<string, number> = {};
            const famStatus = new Map<string, Set<string>>();
            for (const r of knownRows) {
              byStatus[r.status] = (byStatus[r.status] || 0) + 1;
              const cls = r.classroom?.name ?? "(unassigned)";
              byClass[cls] = (byClass[cls] || 0) + 1;
              const payKey = `expects=${r.expectsPayment};paidAt=${Boolean(r.paymentReceivedAt)};stripe=${r.formSubmission?.stripePaymentStatus ?? "none"};payLater=${r.formSubmission?.payLaterChosen ?? false}`;
              byPay[payKey] = (byPay[payKey] || 0) + 1;
              const e = r.child.guardian.email!.trim().toLowerCase();
              if (!famStatus.has(e)) famStatus.set(e, new Set());
              famStatus.get(e)!.add(r.status);
            }
            console.log("known14_regCount", knownRows.length);
            console.log("known14_byStatus", byStatus);
            console.log("known14_byClass", byClass);
            console.log("known14_byPay", byPay);
            const famMix: Record<string, number> = {};
            for (const s of famStatus.values()) {
              const k = [...s].sort().join("+");
              famMix[k] = (famMix[k] || 0) + 1;
            }
            console.log("known14_familyStatusMix", famMix);

            // Classroom-assigned active families (possible mental filter)
            const assigned = activeRows.filter((r) => {
              // need classroom - refetch light
              return true;
            });
            void assigned;
            const withClass = await prisma.registration.findMany({
              where: {
                seasonId: united.id,
                status: { in: activeStatuses },
                classroomId: { not: null },
              },
              select: {
                registrationNumber: true,
                checkInToken: true,
                child: { select: { guardian: { select: { email: true } } } },
              },
            });
            const classElig = new Set<string>();
            for (const r of withClass) {
              const email = r.child.guardian.email?.trim().toLowerCase() ?? "";
              if (!email || !EMAIL_RE.test(email)) continue;
              if (!r.registrationNumber?.trim() || !r.checkInToken?.trim()) continue;
              classElig.add(email);
            }
            console.log(
              "classroomAssignedEligibleFamilies",
              classElig.size,
              "known14Overlap",
              knownEmails.filter((e) => classElig.has(e)).length,
              "exactMatchKnown14",
              classElig.size === 14 && knownEmails.every((e) => classElig.has(e)),
            );
          }

          main()
            .catch((e) => {
              console.error(e);
              process.exit(1);
            })
            .finally(async () => {
              await prisma.$disconnect();
              await pool.end();
            });
          EOF
